[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcall-bench-lite"
version = "0.2.0"
description = "A traceable, multi-model evaluation platform for LLM tool-calling agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "senxichong" }]
keywords = ["llm", "tool-calling", "function-calling", "evaluation", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
local = [
    "transformers>=4.40,<6",
    "torch>=2.1",
]
service = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "celery[redis]>=5.3,<6",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "httpx>=0.27,<1",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "celery[redis]>=5.3,<6",
]

[project.scripts]
toolcall-bench = "toolcall_bench.cli:main"

[project.urls]
Homepage = "https://github.com/senxichong/toolcall-bench-lite"
Repository = "https://github.com/senxichong/toolcall-bench-lite"
Issues = "https://github.com/senxichong/toolcall-bench-lite/issues"

[tool.setuptools.packages.find]
include = ["toolcall_bench*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
