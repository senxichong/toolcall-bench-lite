[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcall-bench-lite"
version = "0.1.0"
description = "A lightweight, deterministic evaluation framework for LLM tool calling."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "senxichong" }]
keywords = ["llm", "tool-calling", "function-calling", "evaluation", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
toolcall-bench = "toolcall_bench.cli:main"

[project.urls]
Homepage = "https://github.com/senxichong/toolcall-bench-lite"
Repository = "https://github.com/senxichong/toolcall-bench-lite"
Issues = "https://github.com/senxichong/toolcall-bench-lite/issues"

[tool.setuptools.packages.find]
include = ["toolcall_bench*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

